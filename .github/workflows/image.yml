name: Durable Streams image
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: durable-streams-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
  image:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/nrutledge/durable-streams:git-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/nrutledge/durable-streams
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=0.1.5-hyperspaces-h2
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable deployment pin
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "ghcr.io/nrutledge/durable-streams:git-${{ github.sha }}@$DIGEST" > image-pin.txt
          cat image-pin.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: image-pin
          path: image-pin.txt
