# Added by HyperSpaces (2026): Verify attribution and publish tested main/owned candidate images with capped BuildKit. Original: durable-streams 0.1.5, Apache-2.0.
name: Durable Streams image
on:
  push:
    branches: [main, review/native-h2c]
  pull_request:
permissions:
  contents: read
concurrency:
  group: durable-streams-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check Apache attribution
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 scripts/check_attribution.py --change-base "$CHANGE_BASE"
          python3 scripts/check_attribution_test.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
  image:
    needs: verify
    if: github.event_name == 'push' && github.repository == 'nrutledge/durable-streams'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            memory=4g
            memory-swap=4g
            cpu-period=100000
            cpu-quota=200000
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/nrutledge/durable-streams:git-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/nrutledge/durable-streams
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=0.1.5-hyperspaces-h2
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable deployment pin
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "ghcr.io/nrutledge/durable-streams:git-${{ github.sha }}@$DIGEST" > image-pin.txt
          cat image-pin.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: image-pin
          path: image-pin.txt
